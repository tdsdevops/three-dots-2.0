  <title>Three Dots Software Development</title>
  <style>
    .dot-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #01091c;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    /* Hide loader when React is loaded */
    .dot-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      position: absolute;
    }

    .dot1 {
      background-color: #0d6eb7;
      animation: move1 2.5s infinite;
    }

    .dot2 {
      background-color: #ed1c24;
      animation: move2 2.5s infinite;
    }

    .dot3 {
      background-color: #ffde16;
      animation: move3 2.5s infinite;
    }

    @keyframes move1 {
      0% {
        transform: translate(0px, -20px);
      }

      33.33% {
        transform: translate(17.3px, 10px);
      }

      66.66% {
        transform: translate(-17.3px, 10px);
      }

      100% {
        transform: translate(0px, -20px);
      }
    }

    @keyframes move2 {
      0% {
        transform: translate(17.3px, 10px);
      }

      33.33% {
        transform: translate(-17.3px, 10px);
      }

      66.66% {
        transform: translate(0px, -20px);
      }

      100% {
        transform: translate(17.3px, 10px);
      }
    }

    @keyframes move3 {
      0% {
        transform: translate(-17.3px, 10px);
      }

      33.33% {
        transform: translate(0px, -20px);
      }

      66.66% {
        transform: translate(17.3px, 10px);
      }

      100% {
        transform: translate(-17.3px, 10px);
      }
    }
  </style>
